<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      const NEW_DOMAIN = "https://easy-image-tools.com";
      const OLD_REPO_NAME = "easy-png-tools";
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;

        background-color: #ddd;
        color: #222;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #222;
          color: #ddd;
        }
      }
    </style>
    <script>
      (function () {
        let currentPath = window.location.pathname;
        if (currentPath.startsWith("/" + OLD_REPO_NAME)) {
          currentPath = currentPath.substring(OLD_REPO_NAME.length + 1);
        }
        const newUrl =
          NEW_DOMAIN +
          currentPath +
          window.location.search +
          window.location.hash;
        window.location.replace(newUrl);
      })();
    </script>

    <noscript>
      <meta
        http-equiv="refresh"
        content="0; url=https://easy-image-tools.com"
      />
      <link rel="canonical" href="https://easy-image-tools.com" />
    </noscript>
  </head>
  <body>
    <p>
      "Easy png tools" now named "Easy image tools" and moved to a new domain.
      Please follow this link: <a href="https://easy-image-tools.com"></a>.
    </p>
  </body>
</html>
